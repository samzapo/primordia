name: Primordia isolated particle capacity probe
"on":
  push:
    branches: [samzapo/remote-ipv6]
    paths: [.github/workflows/particle-capacity-probe.yml, tests/particle_capacity_probe.gd]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primordia-particle-capacity-probe
  cancel-in-progress: false
jobs:
  measure:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Verify target and wired dependency route
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import json,pathlib,socket,subprocess
          for host in ['github.com','api.github.com']:
              found=False
              for entry in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM):
                  result=subprocess.run(['ip','-j','route','get',entry[4][0]],capture_output=True,text=True)
                  if result.returncode:continue
                  for route in json.loads(result.stdout):
                      path=pathlib.Path('/sys/class/net')/route['dev']
                      assert (path/'device').exists() and not (path/'wireless').exists() and not (path/'phy80211').exists()
                      assert (path/'operstate').read_text().strip()=='up'
                      found=True
              assert found
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: samzapo--remote-ipv6--particle-probe-${{ github.run_id }}
          persist-credentials: false
      - name: Build isolated source and measure copied worlds
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/samzapo--remote-ipv6--particle-probe-$GITHUB_RUN_ID"
          python3 - <<'PY'
          import os,pathlib,json,subprocess,time,tempfile,shutil
          from urllib.request import build_opener,ProxyHandler
          from urllib.error import HTTPError
          root=pathlib.Path.home()/'.local/share/primordia-deploy'
          opener=build_opener(ProxyHandler({}))
          def health():
              try:
                  with opener.open('http://127.0.0.1:8766/metrics',timeout=5) as response:return json.load(response)
              except HTTPError as error:
                  if error.code==503:return json.load(error)
                  raise
          before=health()
          print('LIVE_PROBE_CONTEXT '+json.dumps({key:before.get(key) for key in ['build','backend','backend_error','checkpoint_error','world_id','epoch','peers','stored_packets']}),flush=True)
          assert before['peers']==0,'Defer capacity probe while players are connected'
          available=int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
          assert available>8000000,'Insufficient shared memory headroom'
          build_names={'cc1','cc1plus','gcc','g++','clang','clang++','cmake','ninja','make','bazel','ld','rustc'}
          busy=[]
          for item in pathlib.Path('/proc').glob('[0-9]*/comm'):
              try:
                  if item.read_text().strip() in build_names:busy.append(item.name)
              except OSError:pass
          assert not busy,'Defer while another build is active'
          godot=next((root/'runtime').glob('**/Godot_v4.7.2-stable_linux.x86_64'))
          env=dict(os.environ,GODOT_BIN=str(godot),PRIMORDIA_BUILD_JOBS='2')
          build=subprocess.Popen(['bash','tools/build_native.sh'],env=env,start_new_session=True)
          try:
              while build.poll() is None:
                  time.sleep(10)
                  available=int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
                  assert available>4000000,'Build memory headroom exhausted'
              assert build.returncode==0,'Native build failed'
          finally:
              if build.poll() is None:
                  import signal
                  os.killpg(build.pid,signal.SIGTERM)
                  build.wait(timeout=20)
          subprocess.run([str(godot),'--headless','--path','.', '--editor','--import','--quit'],env=env,check=True)
          owned=pathlib.Path(tempfile.mkdtemp(prefix='samzapo--particle-capacity-',dir=os.environ['RUNNER_TEMP']))
          (owned/'OWNERSHIP.json').write_text(json.dumps({'repository':'samzapo/primordia','run':os.environ['GITHUB_RUN_ID'],'source':os.getcwd(),'purpose':'isolated tick-only copied-world capacity probe; production remains untouched'}))
          shutil.copytree(root/'state',owned/'source',ignore=shutil.ignore_patterns('archives','feedback','*.tmp','health.json'))
          rows=[]
          try:
              for limit in [-1,5000,4000,3000,1500,0]:
                  assert health()['peers']==0,'A player connected; stop probe without changing the live pond'
                  state=owned/('case-'+str(limit));state.mkdir()
                  case_env=dict(env,PRIMORDIA_VERIFY_CHECKPOINT_DIR=str(owned/'source'),PRIMORDIA_CAPACITY_PROBE_STATE=str(state))
                  args=['xvfb-run','-a','-s','-screen 0 1280x720x24 -nolisten tcp',str(godot),'--path','.', '--audio-driver','Dummy','--rendering-method','mobile','--rendering-driver','vulkan','--gpu-index','0','--resolution','64x64','--disable-vsync','--max-fps','120','--script','tests/particle_capacity_probe.gd','--','--particle-limit='+str(limit)]
                  result=subprocess.run(args,env=case_env,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,timeout=120)
                  print(result.stdout,flush=True)
                  assert result.returncode==0 and not any(text in result.stdout for text in ['SCRIPT ERROR:','\nERROR:','Parse Error:','Compile Error:']),'Capacity fixture failed'
                  row=next(json.loads(line.split(' ',1)[1]) for line in result.stdout.splitlines() if line.startswith('PARTICLE_CAPACITY '))
                  rows.append(row)
              after=health()
              assert before['world_id']==after['world_id'] and before['epoch']==after['epoch'],'Live authority must not restart'
              assert before['accounts']==after['accounts'] and before['access_keys']==after['access_keys']
              report={'context':'Isolated copied pond with two exterior observers alongside idle live authority. No rendered FPS measurements. Not a phone/device speed guarantee.','cases':rows,'live_world_id':after['world_id'],'live_epoch':after['epoch'],'production_untouched':True}
              print('CAPACITY_REPORT '+json.dumps(report),flush=True)
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write(chr(96)*3+'json\n'+json.dumps(report,indent=2)+'\n'+chr(96)*3+'\n')
          finally:
              shutil.rmtree(owned)
          PY

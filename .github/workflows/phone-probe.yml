name: Primordia phone runner probe
"on":
  push:
    branches: [samzapo/phone-probe]
    paths: [.github/workflows/phone-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: primordia-phone-probe
  cancel-in-progress: true
jobs:
  phone:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 5
    outputs:
      report_b64: ${{ steps.inspect.outputs.report_b64 }}
    steps:
      - name: Inspect start-primordia-runner.sh and Vulkan/GPU access on samzapo-phone
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess

          def run(cmd, timeout=180, env=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, env=env)
                  return {"status": r.returncode, "stdout": r.stdout.strip()[-3000:], "stderr": r.stderr.strip()[-2000:]}
              except Exception as e:
                  return {"error": f"{type(e).__name__}: {e}"}

          report = {}
          env = {**os.environ, "DEBIAN_FRONTEND": "noninteractive", "GODOT_SILENCE_ROOT_WARNING": "1"}
          report["apt_update"] = run(["apt-get", "update", "-q"], env=env)
          report["apt_install"] = run([
              "apt-get", "install", "-y", "--no-install-recommends",
              "cmake", "g++", "make", "ninja-build", "unzip", "libfontconfig1",
              "xvfb", "libvulkan1", "mesa-vulkan-drivers", "vulkan-tools",
              "libgl1", "libegl1", "libxcursor1", "libxinerama1", "libxrandr2", "libxi6", "iproute2"
          ], timeout=240, env=env)

          godot_bin = "/root/.local/share/primordia/runtime/godot-4.7.2-stable/Godot_v4.7.2-stable_linux.arm64"
          report["godot_headless_clean"] = run([godot_bin, "--headless", "--quit"], env=env)
          report["vulkaninfo_debian"] = run(["vulkaninfo", "--summary"], env=env)
          report["xvfb_godot_vulkan"] = run([
              "xvfb-run", "-a", "-s", "-screen 0 640x360x24 -nolisten tcp",
              godot_bin, "--rendering-driver", "vulkan", "--rendering-method", "mobile", "--quit"
          ], env=env)

          text = json.dumps(report, indent=2)
          b64 = base64.b64encode(text.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"report_b64={b64}\n")
          PY

  collect_after:
    if: always() && github.repository == 'samzapo/primordia'
    needs: [phone]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Save phone job output to local build dir
        shell: bash
        env:
          REPORT_B64: ${{ needs.phone.outputs.report_b64 }}
          PHONE_RESULT: ${{ needs.phone.result }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import base64, json, os, pathlib
          out_dir = pathlib.Path("/home/samzapo/Development/primordia/build")
          out_dir.mkdir(parents=True, exist_ok=True)
          b64 = os.environ.get("REPORT_B64", "")
          payload = {"result": os.environ.get("PHONE_RESULT"), "report": json.loads(base64.b64decode(b64).decode("utf-8")) if b64 else None}
          (out_dir / "phone-probe-output-6.json").write_text(json.dumps(payload, indent=2))
          PY

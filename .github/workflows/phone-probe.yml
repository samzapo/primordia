name: Primordia phone runner probe
"on":
  push:
    branches: [samzapo/phone-probe]
    paths: [.github/workflows/phone-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: primordia-phone-probe
  cancel-in-progress: true
jobs:
  phone:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 5
    outputs:
      report_b64: ${{ steps.inspect.outputs.report_b64 }}
    steps:
      - name: Deep probe GPU, Termux, processes and Vulkan on samzapo-phone
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, ctypes, glob, json, os, pathlib, subprocess

          def run(cmd, timeout=15, env=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, env=env)
                  return {"status": r.returncode, "stdout": r.stdout.strip()[:4000], "stderr": r.stderr.strip()[:2000]}
              except Exception as e:
                  return {"error": f"{type(e).__name__}: {e}"}

          report = {}
          # Check /dev/mali0 and /dev permissions directly
          devs = {}
          for p in ["/dev/mali0", "/dev/mali", "/dev/kgsl-3d0", "/dev/dri", "/dev/ashmem", "/dev/binder"]:
              path = pathlib.Path(p)
              info = {"exists": path.exists()}
              if path.exists():
                  try:
                      st = path.stat()
                      info["mode"] = oct(st.st_mode)
                      info["r"] = os.access(p, os.R_OK)
                      info["w"] = os.access(p, os.W_OK)
                  except Exception as e:
                      info["stat_error"] = str(e)
              devs[p] = info
          report["dev_checks"] = devs

          # Check running processes in proot/termux
          report["ps"] = run(["ps", "-ef"])

          # Check termux home and usr
          termux_home = pathlib.Path("/data/data/com.termux/files/home")
          termux_usr = pathlib.Path("/data/data/com.termux/files/usr")
          report["termux_home"] = sorted(p.name for p in termux_home.iterdir()) if termux_home.is_dir() else []
          report["termux_usr_share_vulkan"] = glob.glob("/data/data/com.termux/files/usr/share/vulkan/**/*", recursive=True)
          report["termux_libs_vulkan_gl"] = (
              glob.glob("/data/data/com.termux/files/usr/lib/*vulkan*")
              + glob.glob("/data/data/com.termux/files/usr/lib/*GL*")
              + glob.glob("/data/data/com.termux/files/usr/lib/*EGL*")
              + glob.glob("/usr/lib/aarch64-linux-gnu/*vulkan*")
              + glob.glob("/usr/lib/aarch64-linux-gnu/*GL*")
              + glob.glob("/usr/lib/aarch64-linux-gnu/*EGL*")
          )

          # Check if libvulkan can be loaded and vkEnumerateInstanceExtensionProperties / vkCreateInstance works
          vk_probe = {}
          for libname in ["libvulkan.so.1", "libvulkan.so", "/data/data/com.termux/files/usr/lib/libvulkan.so", "/system/lib64/libvulkan.so"]:
              try:
                  lib = ctypes.CDLL(libname)
                  vk_probe[libname] = "loaded"
              except Exception as e:
                  vk_probe[libname] = f"error: {e}"
          report["dlopen_vulkan"] = vk_probe

          # Check if termux has vulkan-tools or mesa or angle or anything installed
          termux_env = dict(os.environ, PATH="/data/data/com.termux/files/usr/bin:" + os.environ.get("PATH", ""), PREFIX="/data/data/com.termux/files/usr", LD_LIBRARY_PATH="/data/data/com.termux/files/usr/lib")
          report["termux_packages"] = run(["/data/data/com.termux/files/usr/bin/dpkg", "-l"], env=termux_env)
          report["debian_packages_build"] = run(["dpkg-query", "-W", "-f=${binary:Package} ${Version}\n", "cmake*", "ninja*", "g++*", "clang*", "libvulkan*", "mesa*", "xvfb*", "xauth*", "libx11*", "libgl*"])

          # Check network interfaces on phone
          report["ip_addr"] = run(["ip", "-j", "addr"])

          text = json.dumps(report, indent=2)
          b64 = base64.b64encode(text.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"report_b64={b64}\n")
          PY

  collect_after:
    if: always() && github.repository == 'samzapo/primordia'
    needs: [phone]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Save phone job output to local build dir
        shell: bash
        env:
          REPORT_B64: ${{ needs.phone.outputs.report_b64 }}
          PHONE_RESULT: ${{ needs.phone.result }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import base64, json, os, pathlib
          out_dir = pathlib.Path("/home/samzapo/Development/primordia/build")
          out_dir.mkdir(parents=True, exist_ok=True)
          b64 = os.environ.get("REPORT_B64", "")
          payload = {"result": os.environ.get("PHONE_RESULT"), "report": json.loads(base64.b64decode(b64).decode("utf-8")) if b64 else None}
          (out_dir / "phone-probe-output-2.json").write_text(json.dumps(payload, indent=2))
          PY

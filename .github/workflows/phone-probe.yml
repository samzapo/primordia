name: Primordia phone runner probe
"on":
  push:
    branches: [samzapo/phone-probe]
    paths: [.github/workflows/phone-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: primordia-phone-probe
  cancel-in-progress: true
jobs:
  phone:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 5
    outputs:
      report_b64: ${{ steps.inspect.outputs.report_b64 }}
    steps:
      - name: Inspect start-primordia-runner.sh and Vulkan/GPU access on samzapo-phone
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, glob, json, os, pathlib, subprocess

          def run(cmd, timeout=30, env=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, env=env)
                  return {"status": r.returncode, "stdout": r.stdout.strip()[:4000], "stderr": r.stderr.strip()[:2000]}
              except Exception as e:
                  return {"error": f"{type(e).__name__}: {e}"}

          report = {}
          report["root_ls"] = run(["ls", "-la", "/root"])
          report["root_local_share"] = run(["ls", "-la", "/root/.local/share"])
          report["termux_home_ls"] = run(["ls", "-la", "/data/data/com.termux/files/home"])
          report["vulkan_icds"] = {
              p: glob.glob(p + "/*")
              for p in [
                  "/vendor/etc/vulkan/icd.d",
                  "/system/etc/vulkan/icd.d",
                  "/usr/share/vulkan/icd.d",
                  "/data/data/com.termux/files/usr/share/vulkan/icd.d",
                  "/data/data/com.termux/files/usr/etc/vulkan/icd.d",
              ]
              if os.path.exists(p)
          }

          # Test creating a logical VkDevice with a compute queue on Mali-G715
          c_code = r'''
          #include <stdio.h>
          #include <dlfcn.h>
          #include <stdint.h>
          #include <string.h>

          typedef int32_t VkResult;
          typedef uint32_t VkFlags;
          typedef struct VkInstance_T* VkInstance;
          typedef struct VkPhysicalDevice_T* VkPhysicalDevice;
          typedef struct VkDevice_T* VkDevice;
          typedef struct VkQueue_T* VkQueue;

          typedef struct VkApplicationInfo {
              uint32_t sType; const void* pNext; const char* pApplicationName; uint32_t applicationVersion;
              const char* pEngineName; uint32_t engineVersion; uint32_t apiVersion;
          } VkApplicationInfo;
          typedef struct VkInstanceCreateInfo {
              uint32_t sType; const void* pNext; uint32_t flags; const VkApplicationInfo* pApplicationInfo;
              uint32_t enabledLayerCount; const char* const* ppEnabledLayerNames;
              uint32_t enabledExtensionCount; const char* const* ppEnabledExtensionNames;
          } VkInstanceCreateInfo;
          typedef struct VkExtent3D { uint32_t width, height, depth; } VkExtent3D;
          typedef struct VkQueueFamilyProperties {
              VkFlags queueFlags; uint32_t queueCount; uint32_t timestampValidBits; VkExtent3D minImageTransferGranularity;
          } VkQueueFamilyProperties;
          typedef struct VkDeviceQueueCreateInfo {
              uint32_t sType; const void* pNext; VkFlags flags; uint32_t queueFamilyIndex; uint32_t queueCount; const float* pQueuePriorities;
          } VkDeviceQueueCreateInfo;
          typedef struct VkDeviceCreateInfo {
              uint32_t sType; const void* pNext; VkFlags flags; uint32_t queueCreateInfoCount; const VkDeviceQueueCreateInfo* pQueueCreateInfos;
              uint32_t enabledLayerCount; const char* const* ppEnabledLayerNames;
              uint32_t enabledExtensionCount; const char* const* ppEnabledExtensionNames; const void* pEnabledFeatures;
          } VkDeviceCreateInfo;

          int main() {
              void* h = dlopen("/system/lib64/libvulkan.so", RTLD_NOW);
              if (!h) { printf("dlopen failed: %s\n", dlerror()); return 1; }
              VkResult (*vkCreateInstance)(const VkInstanceCreateInfo*, const void*, VkInstance*) = dlsym(h, "vkCreateInstance");
              VkResult (*vkEnumeratePhysicalDevices)(VkInstance, uint32_t*, VkPhysicalDevice*) = dlsym(h, "vkEnumeratePhysicalDevices");
              void (*vkGetPhysicalDeviceQueueFamilyProperties)(VkPhysicalDevice, uint32_t*, VkQueueFamilyProperties*) = dlsym(h, "vkGetPhysicalDeviceQueueFamilyProperties");
              VkResult (*vkCreateDevice)(VkPhysicalDevice, const VkDeviceCreateInfo*, const void*, VkDevice*) = dlsym(h, "vkCreateDevice");
              void (*vkGetDeviceQueue)(VkDevice, uint32_t, uint32_t, VkQueue*) = dlsym(h, "vkGetDeviceQueue");

              VkApplicationInfo app = {0, NULL, "probe", 1, "probe", 1, (1U << 22) | (1U << 12)};
              VkInstanceCreateInfo info = {1, NULL, 0, &app, 0, NULL, 0, NULL};
              VkInstance inst = NULL;
              if (vkCreateInstance(&info, NULL, &inst) != 0) return 2;
              uint32_t count = 1; VkPhysicalDevice dev = NULL;
              if (vkEnumeratePhysicalDevices(inst, &count, &dev) != 0 || count == 0) return 3;
              uint32_t qcount = 0;
              vkGetPhysicalDeviceQueueFamilyProperties(dev, &qcount, NULL);
              printf("queueFamilies=%u\n", qcount);
              VkQueueFamilyProperties qprops[16];
              if (qcount > 16) qcount = 16;
              vkGetPhysicalDeviceQueueFamilyProperties(dev, &qcount, qprops);
              for (uint32_t i = 0; i < qcount; i++) {
                  printf("QF[%u]: flags=0x%x count=%u\n", i, qprops[i].queueFlags, qprops[i].queueCount);
              }
              float prio = 1.0f;
              VkDeviceQueueCreateInfo qinfo = {2, NULL, 0, 0, 1, &prio};
              VkDeviceCreateInfo dinfo = {3, NULL, 0, 1, &qinfo, 0, NULL, 0, NULL, NULL};
              VkDevice ldev = NULL;
              VkResult dres = vkCreateDevice(dev, &dinfo, NULL, &ldev);
              printf("vkCreateDevice=%d ldev=%p\n", dres, (void*)ldev);
              if (dres == 0 && ldev) {
                  VkQueue q = NULL;
                  vkGetDeviceQueue(ldev, 0, 0, &q);
                  printf("vkGetDeviceQueue=%p\n", (void*)q);
              }
              return 0;
          }
          '''
          pathlib.Path("/tmp/vk_dev_probe.c").write_text(c_code)
          termux_env = {
              "PATH": "/data/data/com.termux/files/usr/bin:/system/bin",
              "PREFIX": "/data/data/com.termux/files/usr",
              "LD_LIBRARY_PATH": "/data/data/com.termux/files/usr/lib:/system/lib64",
              "HOME": "/data/data/com.termux/files/home",
              "TMPDIR": "/data/data/com.termux/files/usr/tmp",
          }
          report["compile_vk_dev"] = run(["/data/data/com.termux/files/usr/bin/clang", "/tmp/vk_dev_probe.c", "-ldl", "-o", "/data/data/com.termux/files/usr/tmp/vk_dev_probe"], env=termux_env)
          report["run_vk_dev"] = run(["/data/data/com.termux/files/usr/tmp/vk_dev_probe"], env=termux_env)
          try:
              pathlib.Path("/data/data/com.termux/files/usr/tmp/vk_dev_probe").unlink(missing_ok=True)
              pathlib.Path("/tmp/vk_dev_probe.c").unlink(missing_ok=True)
          except Exception:
              pass

          # Check if Termux has any godot or vulkan packages available in pkg search
          report["termux_pkg_vulkan"] = run(["/data/data/com.termux/files/usr/bin/apt-cache", "search", "vulkan|godot|mesa|cmake|ninja"], env=termux_env)
          report["debian_apt_cache"] = run(["apt-cache", " policy", "cmake", "g++", "unzip", "xvfb", "mesa-vulkan-drivers"])

          text = json.dumps(report, indent=2)
          b64 = base64.b64encode(text.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"report_b64={b64}\n")
          PY

  collect_after:
    if: always() && github.repository == 'samzapo/primordia'
    needs: [phone]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Save phone job output to local build dir
        shell: bash
        env:
          REPORT_B64: ${{ needs.phone.outputs.report_b64 }}
          PHONE_RESULT: ${{ needs.phone.result }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import base64, json, os, pathlib
          out_dir = pathlib.Path("/home/samzapo/Development/primordia/build")
          out_dir.mkdir(parents=True, exist_ok=True)
          b64 = os.environ.get("REPORT_B64", "")
          payload = {"result": os.environ.get("PHONE_RESULT"), "report": json.loads(base64.b64decode(b64).decode("utf-8")) if b64 else None}
          (out_dir / "phone-probe-output-4.json").write_text(json.dumps(payload, indent=2))
          PY

name: Primordia phone runner probe
"on":
  push:
    branches: [samzapo/phone-probe]
    paths: [.github/workflows/phone-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: primordia-phone-probe
  cancel-in-progress: true
jobs:
  phone:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 10
    outputs:
      report_b64: ${{ steps.inspect.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Build native ARM64 kernels and benchmark world_server on samzapo-phone
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, shutil, subprocess, tempfile

          def run(cmd, timeout=300, env=None, cwd=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, env=env, cwd=cwd)
                  return {"status": r.returncode, "stdout": r.stdout.strip()[-3000:], "stderr": r.stderr.strip()[-2000:]}
              except Exception as e:
                  return {"error": f"{type(e).__name__}: {e}"}

          report = {}
          env = {
              **os.environ,
              "DEBIAN_FRONTEND": "noninteractive",
              "GODOT_SILENCE_ROOT_WARNING": "1",
              "PRIMORDIA_BUILD_JOBS": "4",
          }
          report["apt_extra"] = run(["apt-get", "install", "-y", "--no-install-recommends", "libxkbcommon0", "libdbus-1-3", "psmisc"], env=env)
          runtime_dir = pathlib.Path("/root/.local/share/primordia/runtime")
          report["provision_runtime"] = run(["python3", "tools/provision_runtime.py", "--runtime-dir", str(runtime_dir)], timeout=300, env=env)

          # Cache godot-cpp and liquidfun-original in runtime_dir/native-cache so we don't re-clone/rebuild every time
          cache_dir = runtime_dir / "native-cache"
          cache_dir.mkdir(parents=True, exist_ok=True)
          build_dir = pathlib.Path("build")
          build_dir.mkdir(parents=True, exist_ok=True)
          for sub in ["godot-cpp", "liquidfun-original", "native"]:
              if (cache_dir / sub).exists() and not (build_dir / sub).exists():
                  shutil.copytree(cache_dir / sub, build_dir / sub)

          report["build_native"] = run(["bash", "tools/build_native.sh"], timeout=300, env=env)
          for sub in ["godot-cpp", "liquidfun-original", "native"]:
              if (build_dir / sub).exists():
                  if (cache_dir / sub).exists():
                      shutil.rmtree(cache_dir / sub)
                  shutil.copytree(build_dir / sub, cache_dir / sub)

          godot_bin = str(runtime_dir / "godot-4.7.2-stable" / "Godot_v4.7.2-stable_linux.arm64")
          env["GODOT_BIN"] = godot_bin
          env["XDG_DATA_HOME"] = str(runtime_dir / "xdg-data")
          env["XDG_CONFIG_HOME"] = str(runtime_dir / "xdg-config")
          env["XDG_CACHE_HOME"] = str(runtime_dir / "xdg-cache")

          report["import_project"] = run([godot_bin, "--headless", "--path", ".", "--editor", "--import", "--quit"], timeout=120, env=env)
          with tempfile.TemporaryDirectory(prefix="primordia-phone-bench-") as state_dir:
              env_srv = {**env, "PRIMORDIA_INVITE": "0123456789abcdef0123456789abcdef"}
              report["world_server_cpu"] = run([
                  godot_bin, "--headless", "--path", ".", "res://scenes/world_server.tscn",
                  "--", "--cpu", f"--state-dir={state_dir}", "--port=19877", "--shutdown-after=6"
              ], timeout=60, env=env_srv)
              health_path = pathlib.Path(state_dir) / "health.json"
              if health_path.is_file():
                  report["world_server_health"] = json.loads(health_path.read_text())

          text = json.dumps(report, indent=2)
          b64 = base64.b64encode(text.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"report_b64={b64}\n")
          PY

  collect_after:
    if: always() && github.repository == 'samzapo/primordia'
    needs: [phone]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Save phone job output to local build dir
        shell: bash
        env:
          REPORT_B64: ${{ needs.phone.outputs.report_b64 }}
          PHONE_RESULT: ${{ needs.phone.result }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import base64, json, os, pathlib
          out_dir = pathlib.Path("/home/samzapo/Development/primordia/build")
          out_dir.mkdir(parents=True, exist_ok=True)
          b64 = os.environ.get("REPORT_B64", "")
          payload = {"result": os.environ.get("PHONE_RESULT"), "report": json.loads(base64.b64decode(b64).decode("utf-8")) if b64 else None}
          (out_dir / "phone-probe-output-7.json").write_text(json.dumps(payload, indent=2))
          PY

name: Primordia phone runner probe
"on":
  push:
    branches: [samzapo/phone-probe]
    paths: [.github/workflows/phone-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: primordia-phone-probe
  cancel-in-progress: true
jobs:
  phone:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, ARM64]
    timeout-minutes: 5
    outputs:
      report_b64: ${{ steps.inspect.outputs.report_b64 }}
    steps:
      - name: Inspect start-primordia-runner.sh and Vulkan/GPU access on samzapo-phone
        id: inspect
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, stat, subprocess, urllib.request, zipfile

          def run(cmd, timeout=60, env=None):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout, env=env)
                  return {"status": r.returncode, "stdout": r.stdout.strip()[:4000], "stderr": r.stderr.strip()[:2000]}
              except Exception as e:
                  return {"error": f"{type(e).__name__}: {e}"}

          report = {}
          report["debian_apt_policy"] = run(["apt-cache", "policy", "cmake", "g++", "unzip", "xvfb", "mesa-vulkan-drivers"])

          # Test downloading and running Godot 4.7.2 linux.arm64 in /root/.local/share/primordia/runtime
          runtime_dir = pathlib.Path("/root/.local/share/primordia/runtime")
          godot_dir = runtime_dir / "godot-4.7.2-stable"
          godot_bin = godot_dir / "Godot_v4.7.2-stable_linux.arm64"
          if not godot_bin.is_file():
              godot_dir.mkdir(parents=True, exist_ok=True)
              url = "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.arm64.zip"
              zip_path = runtime_dir / "downloads" / "Godot_v4.7.2-stable_linux.arm64.zip"
              zip_path.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(url, zip_path)
              with zipfile.ZipFile(zip_path, "r") as zf:
                  zf.extractall(godot_dir)
              godot_bin.chmod(godot_bin.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)

          report["godot_version"] = run([str(godot_bin), "--version"])
          report["godot_headless_test"] = run([str(godot_bin), "--headless", "--quit"])

          text = json.dumps(report, indent=2)
          b64 = base64.b64encode(text.encode("utf-8")).decode("ascii")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"report_b64={b64}\n")
          PY

  collect_after:
    if: always() && github.repository == 'samzapo/primordia'
    needs: [phone]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    steps:
      - name: Save phone job output to local build dir
        shell: bash
        env:
          REPORT_B64: ${{ needs.phone.outputs.report_b64 }}
          PHONE_RESULT: ${{ needs.phone.result }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 - <<'PY'
          import base64, json, os, pathlib
          out_dir = pathlib.Path("/home/samzapo/Development/primordia/build")
          out_dir.mkdir(parents=True, exist_ok=True)
          b64 = os.environ.get("REPORT_B64", "")
          payload = {"result": os.environ.get("PHONE_RESULT"), "report": json.loads(base64.b64decode(b64).decode("utf-8")) if b64 else None}
          (out_dir / "phone-probe-output-5.json").write_text(json.dumps(payload, indent=2))
          PY

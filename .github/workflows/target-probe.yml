name: Primordia deployment readiness
"on":
  push:
    branches: [samzapo/persistent-multiplayer]
    paths: [.github/workflows/target-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect the authorized deployment target
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          task_dir="$RUNNER_TEMP/samzapo--persistent-multiplayer--probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$task_dir"
          cd "$task_dir"
          hostname
          pwd
          python3 - <<'PY'
          import json, os, pathlib, shutil, socket, subprocess
          from urllib.request import build_opener, ProxyHandler
          def run(args):
              value=subprocess.run(args,capture_output=True,text=True,timeout=10)
              return {"status":value.returncode,"output":value.stdout.strip()}
          os.environ.setdefault("XDG_RUNTIME_DIR",f"/run/user/{os.getuid()}")
          report={"tools":{name:bool(shutil.which(name)) for name in ["Xvfb","Xorg","xauth","vulkaninfo","curl","unzip","cmake","ninja"]}}
          report["user_manager"]=run(["systemctl","--user","is-system-running"])
          report["linger"]=run(["loginctl","show-user",str(os.getuid()),"-p","Linger","--value"])
          report["x11_socket"]=pathlib.Path("/tmp/.X11-unix/X0").exists()
          report["display_auth_candidates"]={str(p):p.exists() for p in [pathlib.Path.home()/".Xauthority",pathlib.Path(f"/run/user/{os.getuid()}/gdm/Xauthority")]}
          report["wired_routes"]={}
          for host in ["github.com","api.github.com","release-assets.githubusercontent.com"]:
              routes=[]
              for value in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM):
                  result=run(["ip","-j","route","get",value[4][0]])
                  if result["status"]:continue
                  for route in json.loads(result["output"]):
                      interface=route.get("dev","")
                      path=pathlib.Path("/sys/class/net")/interface
                      routes.append({"interface":interface,"wired":(path/"device").exists() and not (path/"wireless").exists() and not (path/"phy80211").exists() and (path/"operstate").read_text().strip()=="up"})
              report["wired_routes"][host]=routes
          report["ports_available"]={}
          for port in [8766,8767]:
              with socket.socket() as stream:
                  try:stream.bind(("0.0.0.0",port));report["ports_available"][str(port)]=True
                  except OSError:report["ports_available"][str(port)]=False
          try:
              with build_opener(ProxyHandler({})).open("http://127.0.0.1:8765/api/network",timeout=3) as response:
                  report["existing_home_urls"]=json.load(response).get("home_urls",[])
          except OSError: report["existing_home_urls"]=[]
          if shutil.which("vulkaninfo"):
              info=run(["vulkaninfo","--summary"])
              report["vulkan"]={"status":info["status"],"devices":[line.strip() for line in info["output"].splitlines() if any(key in line for key in ["deviceName","deviceType","driverName"])]}
          print(json.dumps(report,indent=2))
          PY
          cd "$RUNNER_TEMP"
          rmdir "$task_dir"

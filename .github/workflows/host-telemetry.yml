name: Primordia bounded process memory probe
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primordia-host-telemetry
  cancel-in-progress: false
jobs:
  memory:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Read owned process memory without loading worlds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,tempfile,urllib.request
          directory=pathlib.Path(tempfile.mkdtemp(prefix="samzapo--pond-memory-probe--",dir=os.environ["RUNNER_TEMP"]))
          directory.chmod(0o700)
          print("Execution host: "+os.uname().nodename+"; task directory: "+str(directory),flush=True)
          try:
              request=urllib.request.Request("https://api.github.com/repos/samzapo/primordia/contents/tools/memory_probe.py?ref="+os.environ["GITHUB_SHA"],headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github.raw+json"})
              with urllib.request.urlopen(request,timeout=20) as response:source=response.read(65537)
              assert len(source)<=65536
              script=directory/"memory_probe.py";script.write_bytes(source)
              subprocess.run(["python3",str(script),"--samples","3","--interval","10"],check=True,timeout=90)
          finally:
              script=directory/"memory_probe.py"
              script.unlink(missing_ok=True)
              directory.rmdir()
          PYCODE

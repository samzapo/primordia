name: Primordia host telemetry

"on":
  push:
    branches: [samzapo/persistent-multiplayer]
    paths: [.github/workflows/host-telemetry.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primordia-host-telemetry
  cancel-in-progress: false

jobs:
  capabilities:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Collect bounded host capabilities and load
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RUNNER_NAME" = "samzapo-desktop"
          task_dir="$RUNNER_TEMP/samzapo--persistent-multiplayer--telemetry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$task_dir"
          cd "$task_dir"
          hostname
          pwd
          python3 - <<'PY'
          import csv
          import glob
          import hashlib
          import io
          import json
          import os
          import pathlib
          import platform
          import shutil
          import re
          import socket
          import ssl
          import subprocess
          import time

          def command(args):
              try:
                  result = subprocess.run(args, capture_output=True, text=True, timeout=10)
                  return {"status": result.returncode, "output": result.stdout.strip(), "error": result.stderr.strip()[:1000]}
              except (OSError, subprocess.TimeoutExpired) as error:
                  return {"status": "unavailable", "reason": type(error).__name__}

          def memory():
              fields = {}
              for line in pathlib.Path("/proc/meminfo").read_text().splitlines():
                  key, value = line.split(":", 1)
                  if key in {"MemTotal", "MemAvailable", "SwapTotal", "SwapFree"}:
                      fields[key + "_KiB"] = int(value.split()[0])
              return fields

          def sample():
              value = {"time_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                       "load_1_5_15": os.getloadavg(), "memory": memory()}
              pressure = pathlib.Path("/proc/pressure/memory")
              if pressure.exists():
                  value["memory_pressure"] = pressure.read_text().strip()
              if shutil.which("nvidia-smi"):
                  fields = ["name", "driver_version", "memory.total", "memory.used",
                            "utilization.gpu", "temperature.gpu", "power.draw", "power.limit"]
                  result = command(["nvidia-smi", "--query-gpu=" + ",".join(fields),
                                    "--format=csv,noheader,nounits"])
                  value["gpu_query_status"] = result["status"]
                  if result["status"] == 0:
                      value["gpus"] = [dict(zip(fields, row)) for row in csv.reader(io.StringIO(result["output"]), skipinitialspace=True)]
              return value

          cpu_models = sorted({line.split(":", 1)[1].strip()
                               for line in pathlib.Path("/proc/cpuinfo").read_text().splitlines()
                               if line.startswith("model name")})
          builds = {}
          for item in glob.glob("/proc/[0-9]*/comm"):
              try:
                  name = pathlib.Path(item).read_text().strip()
              except (OSError, UnicodeError):
                  continue
              if name in {"cc1", "cc1plus", "gcc", "g++", "clang", "clang++", "cmake", "ninja", "make", "bazel", "ld", "rustc"}:
                  builds[name] = builds.get(name, 0) + 1
          space = shutil.disk_usage(".")
          report = {
              "host": platform.node(), "os": platform.system(), "architecture": platform.machine(),
              "kernel": platform.release(), "cpu_models": cpu_models,
              "logical_cpus": os.cpu_count(),
              "tools_present": {name: bool(shutil.which(name)) for name in
                                ["godot", "godot4", "vulkaninfo", "nvidia-smi", "cmake", "ninja", "systemctl"]},
              "gpu_render_node_count": len(glob.glob("/dev/dri/renderD*")),
              "display_environment_present": {name: bool(os.environ.get(name)) for name in
                                              ["DISPLAY", "WAYLAND_DISPLAY", "XDG_RUNTIME_DIR"]},
              "build_process_counts": builds,
              "workspace_disk_total_bytes": space.total,
              "workspace_disk_free_bytes": space.free,
              "samples": [],
          }
          for index in range(3):
              report["samples"].append(sample())
              if index < 2:
                  time.sleep(5)
          report["vulkan_summary"] = command(["xvfb-run", "-a", "vulkaninfo", "--summary"])
          driver_variables = ["VK_ICD_FILENAMES", "VK_DRIVER_FILES", "VK_LOADER_DRIVERS_SELECT", "VK_LOADER_DRIVERS_DISABLE", "DRI_PRIME", "__NV_PRIME_RENDER_OFFLOAD"]
          # Bounded host scheduling/clock evidence; never read other project source
          # or process environments beyond the owned Primordia service below.
          report["gpu_clocks"] = command(["nvidia-smi", "--query-gpu=name,pstate,clocks.current.graphics,clocks.current.sm,clocks.current.memory,power.draw,power.limit,temperature.gpu,utilization.gpu", "--format=csv,noheader"])
          report["gpu_performance_detail"] = command(["nvidia-smi", "-q", "-d", "PERFORMANCE,TEMPERATURE,CLOCK,POWER"])
          report["gpu_supported_stock_clocks"] = command(["nvidia-smi", "--query-supported-clocks=memory,graphics", "--format=csv,noheader,nounits"])
          report["numa_topology"] = []
          for node in sorted(pathlib.Path("/sys/devices/system/node").glob("node[0-9]*")):
              entry = {"node":node.name}
              for name in ["cpulist", "distance"]:
                  try: entry[name] = (node / name).read_text().strip()
                  except OSError: pass
              try: entry["memory"] = [line.strip() for line in (node / "meminfo").read_text().splitlines() if "MemTotal:" in line or "MemFree:" in line]
              except OSError: pass
              report["numa_topology"].append(entry)
          report["gpu_numa_node"] = command(["cat", "/sys/bus/pci/devices/0000:41:00.0/numa_node"])
          report["runner_cpu_affinity"] = [line for line in pathlib.Path("/proc/self/status").read_text().splitlines() if line.startswith(("Cpus_allowed_list:", "Mems_allowed_list:"))]
          report["cpu_policies"] = []
          for policy in sorted(pathlib.Path("/sys/devices/system/cpu/cpufreq").glob("policy*")):
              values = {"policy": policy.name}
              for name in ["scaling_governor", "scaling_cur_freq", "scaling_min_freq", "scaling_max_freq", "cpuinfo_max_freq", "energy_performance_preference"]:
                  try: values[name] = (policy / name).read_text().strip()
                  except OSError: pass
              report["cpu_policies"].append(values)
          own_group = next((line.split(":", 2)[2] for line in pathlib.Path("/proc/self/cgroup").read_text().splitlines() if line.startswith("0:")), "/")
          group_path = pathlib.Path("/sys/fs/cgroup") / own_group.lstrip("/")
          report["runner_cgroup_limits"] = []
          for path in [group_path, *group_path.parents]:
              if str(path) == "/sys/fs": break
              limits = {"level": path.name}
              for name in ["cpu.max", "cpu.stat", "cpuset.cpus.effective"]:
                  try: limits[name] = (path / name).read_text().strip()
                  except OSError: pass
              report["runner_cgroup_limits"].append(limits)
          report["godot_processes"] = []
          for comm in pathlib.Path("/proc").glob("[0-9]*/comm"):
              try:
                  if comm.read_text().strip().startswith("Godot"):
                      status = (comm.parent / "status").read_text()
                      report["godot_processes"].append({"pid":int(comm.parent.name),"affinity":[line for line in status.splitlines() if line.startswith("Cpus_allowed_list:")],"wchan":(comm.parent / "wchan").read_text().strip()})
              except OSError: pass
          report["runner_driver_environment"] = {key: os.environ[key] for key in driver_variables if key in os.environ}
          report["vulkan_icds"] = {path.name: json.loads(path.read_text()) for path in pathlib.Path("/usr/share/vulkan/icd.d").glob("*.json")}
          report["nvidia_library_versions"] = command(["nvidia-smi", "--query-gpu=name,driver_version", "--format=csv,noheader"])
          kernel_driver = pathlib.Path("/proc/driver/nvidia/version")
          report["nvidia_loaded_module"] = kernel_driver.read_text().strip() if kernel_driver.exists() else None
          report["nvidia_installed_module"] = command(["modinfo", "-F", "version", "nvidia"])
          report["nvidia_modules_by_kernel"] = {path.name: command(["modinfo", "-k", path.name, "-F", "version", "nvidia"]) for path in pathlib.Path("/lib/modules").iterdir() if path.is_dir()}
          report["default_boot_kernel"] = str(pathlib.Path("/vmlinuz").resolve())
          report["boot_kernel_images"] = sorted(path.name for path in pathlib.Path("/boot").glob("vmlinuz-*") if path.is_file())
          report["boot_kernel_symlink"] = str(pathlib.Path("/boot/vmlinuz").resolve())
          grub = pathlib.Path("/etc/default/grub")
          report["grub_default"] = [line for line in grub.read_text().splitlines() if line.startswith(("GRUB_DEFAULT=", "GRUB_TOP_LEVEL="))] if grub.exists() else []
          report["nvidia_packages"] = command(["dpkg-query", "-W", "-f=${binary:Package} ${Version}\n", "nvidia-driver-*", "nvidia-dkms-*", "linux-modules-nvidia-*", "libnvidia-compute-*", "libnvidia-gl-*"])
          os.environ.setdefault("XDG_RUNTIME_DIR",f"/run/user/{os.getuid()}")
          report["service_manager"] = command(["systemctl","--user","show","primordia.service","-p","MainPID","-p","ActiveState","-p","SubState","-p","NRestarts","-p","ControlGroup"])
          fields = dict(line.split("=",1) for line in report["service_manager"].get("output","").splitlines() if "=" in line)
          group = pathlib.Path("/sys/fs/cgroup") / fields.get("ControlGroup","").lstrip("/") / "cgroup.procs"
          report["owned_service_processes"] = []
          if fields.get("ControlGroup") and group.exists():
              for pid in group.read_text().split():
                  proc=pathlib.Path("/proc")/pid
                  try:
                      report["owned_service_processes"].append({"pid":int(pid),"name":(proc/"comm").read_text().strip(),"wait":(proc/"wchan").read_text().strip(),"cwd":str((proc/"cwd").resolve()),"runner_tracking_present":b"RUNNER_TRACKING_ID=" in (proc/"environ").read_bytes()})
                  except OSError:pass
          report["service_driver_environment"] = []
          for item in report["owned_service_processes"]:
              try:
                  values = dict(entry.split(b"=", 1) for entry in (pathlib.Path("/proc")/str(item["pid"])/"environ").read_bytes().split(b"\0") if b"=" in entry)
                  report["service_driver_environment"].append({"process": item["name"], "driver_variables": {key: values[key.encode()].decode() for key in driver_variables if key.encode() in values}})
              except OSError: pass
          report["service_journal"] = command(["journalctl","--user","-u","primordia.service","--since","-3 minutes","--no-pager","-n","80"])
          # Inspect checksummed saved selection without restoring a world, joining,
          # rotating credentials, or writing the live state directory.
          deployment = pathlib.Path.home() / ".local/share/primordia-deploy"
          report["candidate_frame_profiles"] = []
          import statistics
          profiles = sorted((deployment / "releases").glob("*/build/frame-budget-*.json"), key=lambda path:path.stat().st_mtime, reverse=True)[:3]
          for profile in profiles:
              if profile.stat().st_size > 32*1024*1024: continue
              trace=json.loads(profile.read_text());rows=trace.get("rows",[])[1:]
              if not rows: continue
              wall=sum(row["wall_ms"] for row in rows)
              phases=sorted({key for row in rows for key in row["phases_ms"]})
              report["candidate_frame_profiles"].append({"release":profile.parent.parent.name,"scope":profile.name,"fps":1000*len(rows)/wall,"sim_wall":sum(row["sim_dt"] for row in rows)/(wall/1000),"phase_mean_ms":{key:statistics.mean(row["phases_ms"].get(key,0) for row in rows) for key in phases},"render_boundary_ms":statistics.mean(row["render_boundary_ms"] for row in rows),"gpu_ms":statistics.mean(row["render_gpu_ms"] for row in rows),"cpu_ms":statistics.mean(row["render_cpu_ms"] for row in rows),"gpu":trace.get("gpu"),"display":trace.get("display")})
          registry = deployment / "access-keys.json"
          if registry.is_file():
              registry_bytes = registry.read_bytes()
              report["access_registry"] = {"entries": len(json.loads(registry_bytes).get("hashes", [])), "sha256": hashlib.sha256(registry_bytes).hexdigest()}
          current = deployment / "current"
          if current.is_dir():
              runtime = deployment / "runtime/Godot_v4.7.2-stable_linux.x86_64"
              if not runtime.is_file():
                  matches = list((deployment / "runtime").glob("**/Godot_v4.7.2-stable_linux.x86_64"))
                  runtime = matches[0] if matches else runtime
              import base64
              from urllib.request import Request, urlopen
              request = Request("https://api.github.com/repos/samzapo/primordia/contents/tools/world_status.gd?ref=" + os.environ["GITHUB_SHA"], headers={"Authorization":"Bearer " + os.environ["GH_TOKEN"], "Accept":"application/vnd.github+json"})
              with urlopen(request, timeout=10) as response:
                  source = base64.b64decode(json.load(response)["content"]).decode()
              if runtime.is_file():
                  # Extend the read-only inspector, without restoring a simulation
                  # or exposing account/session keys.
                  assert "var summary:=selection(saved)" in source, "Unknown saved-world inspector"
                  source = source.replace("var summary:=selection(saved)", "var summary:=selection(saved)\n\tsummary.identity=identity_summary(saved)")
                  source += __import__("textwrap").dedent("""
                      static func identity_summary(saved: Dictionary) -> Dictionary:
                      \tvar graph: Dictionary=saved.get("graph",{})
                      \tvar root: Dictionary=graph.get("root",{})
                      \tvar objects: Array=graph.get("objects",[])
                      \tvar world: Dictionary=fields(root.get("world"),objects)
                      \tvar cells: Dictionary={}
                      \tfor reference in world.get("cells",{}).get("$array",[]):
                      \t\tvar cell: Dictionary=fields(reference,objects)
                      \t\tcells[int(cell.get("id",-1))]=cell
                      \tvar accounts: Array=[]
                      \tfor account in root.get("accounts",{}).values().slice(0,8):
                      \t\tvar selected: int=int(account.get("selected",-1))
                      \t\tvar body: Dictionary=cells.get(selected,fields(account.get("current"),objects))
                      \t\tvar anatomy: Array=[]
                      \t\tfor organ in body.get("organs",{}).get("$array",[]):
                      \t\t\tvar shape: Dictionary={}
                      \t\t\tfor key in ["id","kind","a","scale","mode","mutation","steering"]:
                      \t\t\t\tif organ.has(key):shape[key]=organ[key]
                      \t\t\tanatomy.append(shape)
                      \t\taccounts.append({"selected":selected,"body":body.get("id",-1),"lineage":body.get("lineage",-1),"dead":body.get("dead",true),"age":body.get("age",0),"organs":anatomy,"anatomy_sha256":JSON.stringify(anatomy).sha256_text()})
                      \tvar medium: Dictionary=fields(world.get("fluid"),objects)
                      \tvar velocities: PackedVector2Array=medium.get("velocity",PackedVector2Array())
                      \tvar speeds: Array=[];var nonfinite:=0;var momentum:=Vector2.ZERO
                      \tfor v in velocities:
                      \t\tif v.is_finite():speeds.append(v.length());momentum+=v
                      \t\telse:nonfinite+=1
                      \tspeeds.sort()
                      \tvar bodies: Array=[]
                      \tfor body in cells.values():
                      \t\tif body.get("dead",true):continue
                      \t\tvar v: Vector2=body.get("velocity",Vector2.ZERO)
                      \t\tbodies.append({"id":body.get("id",-1),"speed":v.length(),"angular":body.get("angular_velocity",0),"mass":body.get("mass",0)})
                      \tbodies.sort_custom(func(a,b):return a.speed>b.speed)
                      \tvar native_flags: Dictionary={}
                      \tfor key in world:
                      \t\tif str(key).begins_with("native_"):native_flags[key]=world[key]
                      \tvar membrane_flags: Array=[]
                      \tfor record in objects:
                      \t\tif record.kind=="membrane":membrane_flags.append({"constraints":record.fields.get("native_constraints"),"outline":record.fields.get("native_outline")})
                      \treturn {"native_flags":native_flags,"membrane_flags":membrane_flags,"world_id":saved.get("world_id",""),"epoch":saved.get("epoch",0),"tick":saved.get("tick",0),"food_supply_version":saved.get("food_supply_version",0),"food_supply":saved.get("food_supply",{}),"accounts":accounts,"fluid":{"nodes":velocities.size(),"nonfinite":nonfinite,"speed_p50":speeds[speeds.size()/2] if not speeds.is_empty() else 0,"speed_p95":speeds[int(speeds.size()*.95)] if not speeds.is_empty() else 0,"speed_max":speeds[-1] if not speeds.is_empty() else 0,"mean_velocity":[momentum.x/maxi(1,speeds.size()),momentum.y/maxi(1,speeds.size())]},"fastest_cells":bodies.slice(0,8)}
                  """)
                  inspection = pathlib.Path("selection-project").resolve()
                  (inspection / "scripts/network").mkdir(parents=True)
                  (inspection / "project.godot").write_text('config_version=5\n[application]\nconfig/name="Primordia selection inspection"\n')
                  (inspection / "scripts/network/world_store.gd").write_text((current / "scripts/network/world_store.gd").read_text())
                  (inspection / "report.gd").write_text(source)
                  try:
                      result = subprocess.run([str(runtime), "--headless", "--path", str(inspection), "--script", str(inspection / "report.gd"), "--", "--state-dir=" + str(deployment / "state")], capture_output=True, text=True, timeout=30)
                      lines = [line for line in result.stdout.splitlines() if line.startswith("WORLD_SELECTION ")]
                      report["saved_selection"] = json.loads(lines[-1].split(" ", 1)[1]) if lines else {"status":"unavailable", "exit_status":result.returncode}
                      archive = report["saved_selection"].get("identity", {}).get("food_supply", {}).get("archive", "")
                      if re.fullmatch(r"archives/pond-[a-f0-9]{32}--epoch-[0-9]+--tick-[0-9]+", archive):
                          archived = subprocess.run([str(runtime), "--headless", "--path", str(inspection), "--script", str(inspection / "report.gd"), "--", "--state-dir=" + str(deployment / "state" / archive)], capture_output=True, text=True, timeout=30)
                          archived_lines = [line for line in archived.stdout.splitlines() if line.startswith("WORLD_SELECTION ")]
                          report["saved_selection"]["identity_before_food_supply"] = json.loads(archived_lines[-1].split(" ", 1)[1]).get("identity", {}) if archived_lines else {"status":"unavailable"}
                  finally:
                      shutil.rmtree(inspection)
              else:
                  report["saved_selection"] = {"status":"unavailable", "reason":"Inspection runtime unavailable in current deployment"}
          from urllib.error import HTTPError
          from urllib.request import build_opener, ProxyHandler, HTTPSHandler, Request
          try:
              with build_opener(ProxyHandler({})).open("http://127.0.0.1:8766/metrics",timeout=5) as response:
                  report["primordia_service"] = json.load(response)
          except HTTPError as error:
              try: report["primordia_service"] = {"http_status":error.code,"metrics":json.load(error)}
              except ValueError: report["primordia_service"] = {"http_status":error.code}
          except OSError:
              report["primordia_service"] = {"status":"unavailable"}
          # Read only bounded documents and an unauthenticated upgrade; never send player keys.
          def browser_delivery(host, context):
              authority = f"[{host}]:8766" if ":" in host else f"{host}:8766"
              url = f"https://{authority}"
              result = {}
              opener = build_opener(ProxyHandler({}), HTTPSHandler(context=context))
              try:
                  with opener.open(url + "/?delivery-check=1", timeout=5) as response:
                      document = response.read(262145)
                      if len(document) > 262144:
                          raise ValueError("Browser document exceeds telemetry limit")
                      match = re.search(rb"const GODOT_CONFIG = ([^\r\n]+);", document)
                      if not match:
                          raise ValueError("Browser document has no Godot configuration")
                      config = json.loads(match.group(1))
                      result["document"] = {"status": response.status,
                                            "experimental_virtual_keyboard": config.get("experimentalVK"),
                                            "main_pack": config.get("mainPack"),
                                            "sha256": hashlib.sha256(document).hexdigest(),
                                            "cache_control": response.headers.get("Cache-Control")}
                      result["document"]["profile_overlay_present"] = b"primordia-profile" in document
                      result["assets"] = {}
                      for filename, expected_bytes in list(config.get("fileSizes", {}).items())[:4]:
                          if not re.fullmatch(r"[A-Za-z0-9_.-]+", filename):
                              result["assets"][filename] = {"error": "InvalidFilename"}
                              continue
                          try:
                              with opener.open(Request(url + "/" + filename, method="HEAD"), timeout=5) as asset:
                                  size = int(asset.headers.get("Content-Length", -1))
                                  result["assets"][filename] = {"status":asset.status, "bytes":size, "expected_bytes":expected_bytes, "size_matches":size==expected_bytes, "cache_control":asset.headers.get("Cache-Control")}
                          except (OSError, ValueError) as error:
                              result["assets"][filename] = {"error":type(error).__name__}
              except (OSError, ValueError) as error:
                  result["document"] = {"error": type(error).__name__, "detail": str(error)[:300]}
              try:
                  with opener.open(url + "/health", timeout=5) as response:
                      health = json.load(response)
                      result["health"] = {key: health.get(key) for key in ["build", "backend", "gpu", "world_id", "epoch", "tick", "backend_error", "checkpoint_error"]}
              except (OSError, ValueError) as error:
                  result["health"] = {"error": type(error).__name__, "detail": str(error)[:300]}
              try:
                  import base64
                  key = base64.b64encode(os.urandom(16)).decode("ascii")
                  request = (f"GET /ws HTTP/1.1\r\nHost: {authority}\r\nOrigin: {url}\r\n"
                             f"Upgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\n"
                             "Sec-WebSocket-Version: 13\r\n\r\n").encode("ascii")
                  with socket.create_connection((host, 8766), timeout=5) as raw:
                      with context.wrap_socket(raw, server_hostname=host) as connection:
                          connection.sendall(request)
                          headers = b""
                          while b"\r\n\r\n" not in headers and len(headers) < 16384:
                              block = connection.recv(4096)
                              if not block:
                                  break
                              headers += block
                          result["websocket"] = {"status_line": headers.split(b"\r\n", 1)[0].decode("ascii", "replace")}
              except OSError as error:
                  result["websocket"] = {"error": type(error).__name__, "detail": str(error)[:300]}
              return result

          report["browser_delivery"] = {}
          ca = pathlib.Path.home() / ".local/share/primordia-deploy/tls/authority/ca.pem"
          if ca.exists():
              report["browser_delivery"]["native_https"] = browser_delivery("127.0.0.1", ssl.create_default_context(cafile=str(ca)))
          report["browser_delivery"]["public_https"] = browser_delivery("2601:19b:401:f7b5:6f5e:e2e9:76e8:8258", ssl.create_default_context())
          # Snapshot decoding above is diagnostic CPU/memory load. Tick
          # percentiles retain more history than the separate phase averages.
          # Read the deployed bound and let that complete window expire.
          tick_window = 600
          host_source = current / "scripts/network/world_host.gd"
          if host_source.is_file():
              window_match = re.search(r"if tick_samples.size\(\)>([0-9]+)", host_source.read_text())
              if window_match:
                  tick_window = int(window_match.group(1))
          cadence = max(1, int(report.get("primordia_service", {}).get("simulation_hz", 30)))
          cooldown = min(120, (tick_window + cadence - 1) // cadence + 2)
          report["steady_service_sample_context"] = {"retained_tick_samples": tick_window, "cooldown_seconds": cooldown}
          report["steady_service_samples"] = []
          time.sleep(cooldown)
          for index in range(3):
              try:
                  with build_opener(ProxyHandler({})).open("http://127.0.0.1:8766/metrics", timeout=5) as response:
                      live = json.load(response)
                  report["steady_service_samples"].append({key: live.get(key) for key in ["updated_unix", "build", "world_id", "epoch", "tick", "living_cells", "simulation_hz", "simulation_wall_ratio", "tick_ms_p50", "tick_ms_p95", "tick_ms_p99", "backend", "gpu", "backend_error", "checkpoint_error", "internal_packets", "stored_packets", "food_supply_version", "peers", "views", "simulation_seconds", "uptime_seconds", "fluid", "snapshots_sent", "ready_views", "snapshots_awaiting_ack", "snapshots_encoding", "snapshot_encode_ms_mean", "publication_pending", "stream_queue"]})
              except OSError as error:
                  report["steady_service_samples"].append({"status": "unavailable", "reason": type(error).__name__})
              if index < 2:
                  time.sleep(6)
          payload = json.dumps(report, indent=2)
          print(payload)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("# Primordia host telemetry\n\nRead-only capabilities and three bounded idle/load samples. Includes private world telemetry when the service is running.\n\n```json\n" + payload + "\n```\n")
          PY
          cd "$RUNNER_TEMP"
          rmdir "$task_dir"

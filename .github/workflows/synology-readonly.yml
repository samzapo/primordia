name: Primordia Synology IPv6 inspection
"on":
  push:
    branches: [samzapo/remote-ipv6]
    paths: [.github/workflows/synology-readonly.yml, tools/synology_ipv6.py, tests/test_synology_ipv6.py, tools/synology_ui_inspect.py]
  workflow_dispatch:
    inputs:
      ui_paths:
        description: Read-only SRM static client paths (at most four)
        type: string
        default: /webman/index.cgi /webman/initdata.cgi /synoSDSjslib/sds.js
permissions:
  contents: read
concurrency:
  group: primordia-synology-router
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'samzapo/primordia'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify target and wired source checkout
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          hostname
          python3 - <<'PYCODE'
          import json,pathlib,socket,subprocess
          for host in ['github.com','api.github.com','codeload.github.com']:
              found=False
              for item in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM):
                  query=subprocess.run(['ip','-j','route','get',item[4][0]],capture_output=True,text=True)
                  if query.returncode:continue
                  for route in json.loads(query.stdout):
                      device=pathlib.Path('/sys/class/net')/route['dev']
                      assert (device/'device').exists() and not (device/'wireless').exists() and not (device/'phy80211').exists() and (device/'operstate').read_text().strip()=='up'
                      found=True
              assert found
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: samzapo--remote-ipv6--${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check pinned router client with isolated fixtures
        shell: bash
        run: |
          task_dir="$GITHUB_WORKSPACE/samzapo--remote-ipv6--$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$task_dir"
          pwd
          python3 tests/test_synology_ipv6.py
      - name: Read IPv6 settings through a certificate-pinned session
        shell: bash
        env:
          PRIMORDIA_ROUTER_USERNAME: ${{ secrets.PRIMORDIA_ROUTER_USERNAME }}
          PRIMORDIA_ROUTER_PASSWORD: ${{ secrets.PRIMORDIA_ROUTER_PASSWORD }}
          PRIMORDIA_ROUTER_CERT_SHA256: c7197b8899f0ce05a0fa163bc3161613688ef27e1f6663e97ae9b2b9939de3f5
        run: |
          if [[ -z "$PRIMORDIA_ROUTER_USERNAME" || -z "$PRIMORDIA_ROUTER_PASSWORD" ]]; then
            echo 'Router credentials are not configured. No login attempted and no settings changed.'
            echo 'Add PRIMORDIA_ROUTER_USERNAME and PRIMORDIA_ROUTER_PASSWORD as repository Actions secrets to permit read-only inspection.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          task_dir="$GITHUB_WORKSPACE/samzapo--remote-ipv6--$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$task_dir"
          python3 tools/synology_ipv6.py
      - name: Read vendor UI request definitions through the pinned session
        shell: bash
        env:
          PRIMORDIA_UI_PATHS: ${{ inputs.ui_paths || '/webman/modules/nsm-Home/NSMHome.js' }}
          PRIMORDIA_ROUTER_USERNAME: ${{ secrets.PRIMORDIA_ROUTER_USERNAME }}
          PRIMORDIA_ROUTER_PASSWORD: ${{ secrets.PRIMORDIA_ROUTER_PASSWORD }}
          PRIMORDIA_ROUTER_CERT_SHA256: c7197b8899f0ce05a0fa163bc3161613688ef27e1f6663e97ae9b2b9939de3f5
        run: |
          cd "$GITHUB_WORKSPACE/samzapo--remote-ipv6--$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tools/synology_ui_inspect.py
      - name: Read narrow game ingress capabilities
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,socket,subprocess
          root=pathlib.Path.home()/'.local/share/primordia-deploy'
          report={'game_ingress_capabilities':True,'read_only':True}
          report['unprivileged_port_start']=pathlib.Path('/proc/sys/net/ipv4/ip_unprivileged_port_start').read_text().strip()
          report['noninteractive_sudo']=subprocess.run(['sudo','-n','true'],capture_output=True,timeout=5).returncode==0
          report['host_ipv6']={key:(pathlib.Path('/proc/sys/net/ipv6/conf/enp4s0')/key).read_text().strip() for key in ['accept_ra','disable_ipv6','forwarding']}
          report['local_low_port_bind']={}
          for port in [80,443]:
              sock=socket.socket(socket.AF_INET6,socket.SOCK_STREAM)
              try:sock.bind(('::1',port));report['local_low_port_bind'][str(port)]='available'
              except OSError as error:report['local_low_port_bind'][str(port)]=type(error).__name__
              finally:sock.close()
          try:
              health=json.loads((root/'state/health.json').read_text())
              report['game']={key:health.get(key) for key in ['world_id','epoch','tick','backend','gpu','backend_error','checkpoint_error','access_keys','accounts']}
          except (OSError,ValueError):report['game']={'status':'unavailable'}
          permissions=subprocess.run(['nmcli','general','permissions'],capture_output=True,text=True,timeout=5)
          report['network_manager_permissions']=permissions.stdout.strip()
          connection=subprocess.run(['nmcli','-g','GENERAL.CONNECTION','device','show','enp4s0'],capture_output=True,text=True,timeout=5)
          if connection.returncode==0:
              method=subprocess.run(['nmcli','-g','ipv6.method','connection','show',connection.stdout.strip()],capture_output=True,text=True,timeout=5)
              report['network_manager_ipv6_method']=method.stdout.strip()
          print(json.dumps(report))
          PYCODE

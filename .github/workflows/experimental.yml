name: Primordia experimental instance
"on":
  push:
    branches: [samzapo/experimental-server]
    paths-ignore: [docs/**, README.md, AGENTS.md]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primordia-experimental-instance
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'samzapo/primordia' && github.actor == 'samzapo'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    steps:
      - name: Verify target and wired source route
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PY'
          import socket,subprocess,json,pathlib
          for host in ['github.com','api.github.com','release-assets.githubusercontent.com']:
              peer=socket.gethostbyname(host)
              for row in json.loads(subprocess.check_output(['ip','-j','route','get',peer],text=True)):
                  p=pathlib.Path('/sys/class/net')/row['dev']
                  assert (p/'device').exists() and not (p/'wireless').exists() and not (p/'phy80211').exists()
                  assert (p/'operstate').read_text().strip()=='up'
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: samzapo--experimental-server--${{ github.run_id }}-${{ github.run_attempt }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check instance isolation and deploy experimental only
        shell: bash
        env:
          PRIMORDIA_PERFORMANCE_WARNINGS: "1"
        run: |
          cd "$GITHUB_WORKSPACE/samzapo--experimental-server--$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tests/test_experimental.py
          python3 tests/test_web_build.py
          python3 tests/test_web_version.py
          python3 tests/test_web_gateway.py
          python3 tools/experimental_instance.py
  verify:
    needs: deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify independent restart and both public paths after cleanup
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 "$HOME/.local/share/primordia-experimental/current/tools/verify_experimental.py" --restart

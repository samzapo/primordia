name: Primordia experimental instance
"on":
  push:
    branches: [samzapo/experimental-server]
    paths-ignore: [docs/**, README.md, AGENTS.md]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy an update, or preserve and suspend the experimental pond
        type: choice
        options: [deploy, standby, network-check]
        default: deploy
      stable_revision:
        description: Optional exact deployed stable SHA for a standby-only repair
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: primordia-experimental-instance
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'samzapo/primordia' && github.actor == 'samzapo' && inputs.operation != 'standby' && inputs.operation != 'network-check'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50
    steps:
      - name: Verify target and wired source route
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PY'
          import socket,subprocess,json,pathlib
          for host in ['github.com','api.github.com','release-assets.githubusercontent.com']:
              peer=socket.gethostbyname(host)
              for row in json.loads(subprocess.check_output(['ip','-j','route','get',peer],text=True)):
                  p=pathlib.Path('/sys/class/net')/row['dev']
                  assert (p/'device').exists() and not (p/'wireless').exists() and not (p/'phy80211').exists()
                  assert (p/'operstate').read_text().strip()=='up'
          PY
      - name: Name task-owned source checkout
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import os,re
          branch=re.sub(r'[^A-Za-z0-9._-]','-',os.environ['SOURCE_REF'].replace('/','--'))
          path=branch+'--'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('path='+path+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ steps.source.outputs.path }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check instance isolation and deploy experimental only
        shell: bash
        env:
          PRIMORDIA_PERFORMANCE_WARNINGS: "1"
          PRIMORDIA_SOURCE_DIRECTORY: ${{ steps.source.outputs.path }}
        run: |
          cd "$GITHUB_WORKSPACE/$PRIMORDIA_SOURCE_DIRECTORY"
          python3 tests/test_experimental.py
          python3 tests/test_experimental_snapshot.py
          python3 tests/test_web_build.py
          python3 tests/test_web_version.py
          python3 tests/test_web_gateway.py
          python3 tools/experimental_instance.py
  standby:
    if: github.repository == 'samzapo/primordia' && github.actor == 'samzapo' && inputs.operation == 'standby'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Name task-owned standby checkout
        id: standby_source
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PYTHON'
          import os,re
          branch=re.sub(r'[^A-Za-z0-9._-]','-',os.environ['GITHUB_REF_NAME'].replace('/','--'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('path='+branch+'--standby-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ steps.standby_source.outputs.path }}
          persist-credentials: false
          fetch-depth: 1
      - name: Preserve and suspend only the experimental pond
        shell: bash
        env:
          EXPECTED_STABLE_SHA: ${{ inputs.stable_revision || github.sha }}
          STANDBY_SOURCE: ${{ steps.standby_source.outputs.path }}
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 "$GITHUB_WORKSPACE/$STANDBY_SOURCE/tools/experimental_standby.py"
  verify:
    needs: deploy
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Verify independent restart and both public paths after cleanup
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          python3 "$HOME/.local/share/primordia-experimental/current/tools/verify_experimental.py" --restart

  network-check:
    if: github.repository == 'samzapo/primordia' && github.actor == 'samzapo' && inputs.operation == 'network-check'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - name: Name isolated network fixture checkout
        id: network_source
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PYTHON'
          import os,re
          branch=re.sub(r'[^A-Za-z0-9._-]','-',os.environ['GITHUB_REF_NAME'].replace('/','--'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('path='+branch+'--network-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ${{ steps.network_source.outputs.path }}
          persist-credentials: false
          fetch-depth: 1
      - name: Exercise slow observer without changing either pond
        shell: bash
        env:
          NETWORK_SOURCE: ${{ steps.network_source.outputs.path }}
          PRIMORDIA_BUILD_JOBS: "2"
          PRIMORDIA_INVITE: bounded-infrastructure-fixture
          PRIMORDIA_PERFORMANCE_WARNINGS: "1"
        run: |
          cd "$GITHUB_WORKSPACE/$NETWORK_SOURCE"
          python3 -u - <<'PYTHON'
          import hashlib,json,os,pathlib,subprocess,sys
          os.environ.setdefault("XDG_RUNTIME_DIR",f"/run/user/{os.getuid()}")
          sys.path.insert(0,str(pathlib.Path.cwd()/"tools"))
          from deploy import run
          from check_capacity import inspect
          from check_wired_route import verify
          from experimental_instance import get_json
          roots=[pathlib.Path.home()/".local/share"/name for name in ["primordia-deploy","primordia-experimental"]]
          def identity():
              result=[]
              for root,port,unit in zip(roots,[8766,8768],["primordia.service","primordia-experimental.service"]):
                  h=get_json(f"http://127.0.0.1:{port}/health")
                  files=[root/"access-keys.json",*(root/"state/feedback").glob("*.json")]
                  result.append({**{k:h[k] for k in ["build","world_id","epoch","tick","accounts"]},
                      "pid":subprocess.check_output(["systemctl","--user","show",unit,"-p","MainPID","--value"],text=True).strip(),
                      "retained":{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files if p.is_file()}})
              return result
          before=identity()
          version=json.loads(pathlib.Path("tools/toolchain.json").read_text())["version"]
          godot=roots[0]/"runtime"/f"Godot_v{version}-stable_linux.x86_64"
          assert godot.is_file()
          os.environ["GODOT_BIN"]=str(godot)
          inspect();verify()
          run("bash","tools/build_native.sh",env=os.environ.copy())
          run(str(godot),"--headless","--path",".","--editor","--import","--quit",env=os.environ.copy())
          status=0
          try:
              for attempt in range(3):
                  print("SLOW_OBSERVER_ATTEMPT",attempt,flush=True)
                  run("xvfb-run","-a","-s","-screen 0 1280x720x24 -nolisten tcp",str(godot),"--path",".",
                      "--rendering-method","mobile","--rendering-driver","vulkan","--gpu-index","0","--resolution","64x64",
                      "--disable-vsync","--max-fps","60","--script","tests/network_live.gd","--","--gpu","--slow-observer",env=os.environ.copy())
          except subprocess.CalledProcessError as error:status=error.returncode
          finally:
              after=identity()
              for a,b in zip(before,after):
                  assert all(a[k]==b[k] for k in ["build","world_id","epoch","pid"])
                  assert b["tick"]>a["tick"] and b["accounts"]>=a["accounts"]
                  assert all(pathlib.Path(p).is_file() and hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==digest for p,digest in a["retained"].items())
              print("NETWORK_CHECK_PONDS_PRESERVED",json.dumps({"before":before,"after":after}),flush=True)
          raise SystemExit(status)
          PYTHON

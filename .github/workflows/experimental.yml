name: Primordia experimental instance
"on":
  push:
    branches: [samzapo/experimental-server]
    paths: [.github/workflows/experimental.yml, tools/experimental_instance.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: primordia-experimental-instance
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'samzapo/primordia' && github.actor == 'samzapo'
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect existing Primordia routing without changing services
        shell: bash
        run: |
          test "$RUNNER_NAME" = samzapo-desktop
          test "$(hostname)" = samzapo-desktop
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path.home()/".local/share/primordia-deploy"
          health=json.loads((root/"state/health.json").read_text())
          print("STABLE",json.dumps({k:health.get(k) for k in ["build","world_id","epoch","tick","accounts","access_keys","gpu","backend","backend_error","checkpoint_error"]}))
          unit=subprocess.run(["systemctl","show","caddy","-p","MainPID","-p","CanReload","-p","FragmentPath"],capture_output=True,text=True)
          print("CADDY_UNIT",unit.stdout.strip())
          p=pathlib.Path("/etc/caddy/Caddyfile")
          print("CADDY_FILE",json.dumps({"exists":p.exists(),"readable":os.access(p,os.R_OK),"writable":os.access(p,os.W_OK)}))
          print("LISTENERS",subprocess.check_output(["ss","-ltn","sport = :8766 or sport = :8767 or sport = :8768 or sport = :8769 or sport = :2019"],text=True))
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              with opener.open("http://127.0.0.1:2019/config/",timeout=3) as response: config=json.load(response)
              servers=config.get("apps",{}).get("http",{}).get("servers",{})
              relevant={name:value for name,value in servers.items() if any(str(at).endswith(":8766") for at in value.get("listen",[]))}
              print("CADDY_API",json.dumps({"available":True,"admin":config.get("admin",{}),"primordia_servers":relevant}))
          except Exception as error:
              print("CADDY_API",json.dumps({"available":False,"error":type(error).__name__}))
              if os.access(p,os.R_OK):
                  c=subprocess.run(["caddy","adapt","--config",str(p),"--adapter","caddyfile"],capture_output=True,text=True)
                  if c.returncode==0:
                      v=json.loads(c.stdout)
                      servers=v.get("apps",{}).get("http",{}).get("servers",{})
                      print("CADDY_ADAPTED",json.dumps({"admin":v.get("admin",{}),"primordia_servers":{n:a for n,a in servers.items() if any(str(at).endswith(":8766") for at in a.get("listen",[]))}}))
                  else:print("CADDY_ADAPT",c.returncode)
          PY
